[project]
name = "our-ark-pai-bench"
version = "1.0.0"
description = "Provider-neutral Persistent Agent Identity benchmark tooling."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/our-ark/pai-bench"
Repository = "https://github.com/our-ark/pai-bench"
Issues = "https://github.com/our-ark/pai-bench/issues"

[project.scripts]
identity-benchmark = "identity_benchmark.cli:main"
identity-benchmark-replay = "identity_benchmark.replay:main"
pai-bench-codex-evaluator = "identity_benchmark.codex_evaluator:main"
pai-bench-enoch-target = "identity_benchmark.integrations.enoch_target:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

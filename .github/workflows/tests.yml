name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install locked build backend
        run: python -m pip install --disable-pip-version-check --require-hashes -r .github/requirements/test-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Verify frozen release
        run: bin/release --check

      - name: Build wheel
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
